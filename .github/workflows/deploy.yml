name: Check and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm qr --self-test
      - name: Configure the repository path
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.BASE_PATH }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CONFIGURED_BASE" ]; then
            echo "BASE_PATH=$CONFIGURED_BASE" >> "$GITHUB_ENV"
          elif [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - run: pnpm build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://sojin7814.github.io/dragon/' }}
          BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
