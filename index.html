<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="description" content="내 휴무와 대바, 양도·교환을 기기에 기록하는 개인용 달력" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>__APP_NAME__</title>
    <style>html{background:#f6f7f2}#boot-message{max-width:26rem;margin:18vh auto;padding:2rem;font-family:system-ui,sans-serif;line-height:1.8;color:#184d3b}#boot-message a{color:inherit}</style>
  </head>
  <body>
    <div id="root"><div id="boot-message" role="status"><strong>__APP_NAME__</strong><p>내 달력을 준비하고 있어요.</p><p id="boot-help">처음에는 인터넷을 연결해주세요. 온라인 준비 후에는 오프라인에서도 사용할 수 있어요.</p></div></div>
    <noscript>달력을 사용하려면 브라우저의 자바스크립트를 켜주세요.</noscript>
    <script>setTimeout(function(){var e=document.getElementById('boot-help');if(e)e.innerHTML='앱을 준비하지 못했어요. 인터넷 연결을 확인하고 <a href="">다시 열어주세요</a>. 저장된 기록은 지우지 마세요.';},12000);</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
